<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextSpace TAP</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;padding:0;background:#060a24;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  #ns-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8892c4;font-size:14px;}
  #ns-notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff;text-align:center;padding:24px;}
  #ns-notfound h1{font-size:22px;margin:0 0 8px;}
  #ns-notfound p{color:#8892c4;font-size:14px;max-width:360px;line-height:1.6;}
  #ns-notfound a{color:#5b8cff;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<div id="ns-loading">Loading profile&hellip;</div>
<script>
(function () {
  var SUPABASE_URL = "https://mnsbieqfbhkvcufeaica.supabase.co";
  var SUPABASE_KEY = "sb_publishable_IS1EfDXlt-s68ESEaHY-Fg_WCV11GTw";

  function getSlug() {
    var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    if (path) return decodeURIComponent(path.split('/')[0]);
    var m = /[?&]u=([^&]*)/.exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : '';
  }

  function showNotFound() {
    document.body.innerHTML =
      '<div id="ns-notfound">' +
        '<h1>Profile not found</h1>' +
        '<p>This NextSpace TAP link doesn\'t match an active profile. Double-check the link, or get your own at ' +
        '<a href="https://tap.nextspacetechnologies.com/">tap.nextspacetechnologies.com</a>.</p>' +
      '</div>';
  }

  var slug = getSlug();
  if (!slug) { showNotFound(); return; }

  fetch(SUPABASE_URL + '/rest/v1/rpc/get_tap_card_by_slug', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    },
    body: JSON.stringify({ p_slug: slug })
  })
    .then(function (res) { return res.json(); })
    .then(function (rows) {
      var row = Array.isArray(rows) ? rows[0] : rows;
      if (!row || !row.card_html) { showNotFound(); return; }
      if (row.display_name) { document.title = row.display_name + ' | NextSpace TAP'; }
      document.body.innerHTML = row.card_html;
    })
    .catch(function () { showNotFound(); });
})();
</script>
</body>
</html>
